name: Build & Deploy Godot Web QA Version
run-name: ${{ github.actor }} deploying QA build
on:
  push:
    branches: [ qa ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Determine build version
      - name: Version 
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
            VERSION="${VERSION:0:30}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      # Create build dir
      - name: Create build dir
        run: mkdir -p ./build/web

      # Export Godot build
      - name: Export 
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=export_templates.tpz&platform=templates 
          relative_project_path: ./game
          cache: true
          export_debug: true
          use_preset_export_path: true
          verbose: true
          presets_to_export: Web

      # Add coi-service-worker
      - name: Add coi-service-worker
        run: |
          ls -lahR ./build
          curl -H 'Accept: application/vnd.github.v3.raw' -sS -O --output-dir /home/runner/work/dungeon-crawler/dungeon-crawler/build/web -L https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/refs/heads/master/coi-serviceworker.min.js
          sed -i '3 i <script src="coi-serviceworker.min.js"></script>' /home/runner/work/dungeon-crawler/dungeon-crawler/build/web/index.html
          
      # Verify build output
      - name: Verify build
        run: |
          ls -lah ./build/web
          test -f ./build/web/coi-serviceworker.min.js || exit 1
          test -f ./build/web/index.html || exit 1

      # Deploy build to Github Pages
      - name: Publish
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          user_name: "github-ci[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish QA web build to gh-pages"
